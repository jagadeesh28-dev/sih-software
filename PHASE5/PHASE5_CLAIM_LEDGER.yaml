metadata:
  benchmark: "Phase 5 Heterogeneous Fleet Optimization Benchmark"
  evaluation_budget_per_run: 2500
  matched_seeds: [1001, 1030]
  total_evaluations: 825000
  total_algorithms: 11
  auditor_role: "Senior Scientific Validation Engineer"

claims:
  - id: "CLAIM-1"
    statement: "Hybrid QI improves run-level feasibility over plain QPSO."
    status: "VERIFIED"
    confidence: 0.99
    source: "PHASE5/results/A5_ABLATION_TABLE.csv"
    experiment: "A0_Plain_QPSO vs A5_Complete_Hybrid_QI on 30 matched seeds (1001-1030)"
    evidence:
      a0_feasibility: 80.0
      a0_failures: 6
      a5_feasibility: 100.0
      a5_failures: 0
      delta_feasibility: "+20.0 percentage points"
      p_value: 0.00419
      effect_size_rank_biserial: 1.0
    allowed_wording: >
      "The complete hybrid QI framework (A5) achieved 100% run-level feasibility across all 30 benchmark seeds,
      eliminating the 20% failure rate observed in plain continuous QPSO (A0)."
    forbidden_wording: >
      "QPSO is fundamentally defective, or quantum magic automatically guarantees feasibility."

  - id: "CLAIM-2"
    statement: "The improvement in feasibility comes primarily from feasibility-first constraint handling rather than quantum search dynamics."
    status: "VERIFIED"
    confidence: 0.98
    source: "PHASE5/results/A5_COMPONENT_CONTRIBUTION.csv"
    experiment: "A0 vs A1 (Deb's Feasibility-First Comparator) ablation test"
    evidence:
      a1_feasibility: 100.0
      a1_delta_feasibility: "+20.0 percentage points"
      a1_vs_a5_physical_objective_p_value: 0.71513
      mechanism: "Deb's rule eliminates penalty inversion where infeasible assignments appeared cheaper than delay-penalized feasible routes."
    allowed_wording: >
      "Ablation testing unequivocally confirms that constraint handling (Deb's feasibility-first rule) was the dominant
      factor in restoring 100% feasibility. The improvement is attributable primarily to constraint handling rather than
      the quantum-inspired search mechanism."
    forbidden_wording: >
      "Quantum mechanics or Q-bit dynamics alone cured the Phase 4 feasibility failure."

  - id: "CLAIM-3"
    statement: "The feasibility improvement comes primarily from discrete-variable search operators alone."
    status: "REFUTED"
    confidence: 0.95
