    experiment: "A0 vs A3 (Discrete QPSO without Deb's rule or repair)"
    evidence:
      a3_feasibility: 86.67
      a3_failed_runs: 4
      failure_taxonomy: "All 4 failures were caused by categorical demand assignment collision."
    allowed_wording: >
      "Discrete QPSO operators alone yielded an 86.67% feasibility rate and were insufficient to completely prevent
      assignment failures without Deb's comparator or repair decoders."
    forbidden_wording: >
      "Discrete QPSO completely solves maritime mixed-variable constraints by itself."

  - id: "CLAIM-4"
    statement: "Q-bit probability representation adds measurable value beyond deterministic repair."
    status: "SUPPORTED"
    confidence: 0.92
    source: "PHASE5/results/A2.csv and PHASE5/results/A4.csv"
    experiment: "A2 (Repair alone) vs A4 (Heterogeneous Q-Bit + Continuous QPSO)"
    evidence:
      a2_diversity: 5.746
      a4_diversity: 189.535
      a2_repair_rate_pct: 25.34
      a4_repair_rate_pct: 0.0
      mechanism: >
        "Deterministic repair collapses population diversity (diversity = 5.75) causing rapid stagnation.
        In contrast, Q-bit probability amplitudes maintain diversity (diversity = 189.54) while achieving 100% feasibility."
    allowed_wording: >
      "Q-bit probabilistic representation prevents the severe population diversity collapse caused by greedy deterministic
      repair, maintaining rich exploration across categorical fleet combinations while preserving 100% feasibility."
    forbidden_wording: >
      "Q-bits provide exponential quantum speedup over classical repair."

