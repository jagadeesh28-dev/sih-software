# Evidence and Claim Governance Ledger
# SIH26138 - Egreen Quanta Platform
# Enforces strict epistemic classification across reports, papers, and dashboard presentations.
#
# Epistemic Taxonomy:
# - FACT: Documented requirement, mathematical theorem, verified architecture, or code contract.
# - MEASURED_RESULT: Empirically verified metric from executed simulation/benchmark.
# - HYPOTHESIS: Unproven conjecture subject to empirical refutation.
# - TARGET: Quantitative goal established by stakeholders or regulations.
# - ASSUMPTION: Unverified premise required for modeling.

